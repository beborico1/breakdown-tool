<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caption Copier</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Meet Captions</h1>
    <div class="buttons">
      <button id="copyAll" class="btn btn-primary">Copy All Captions</button>
      <button id="copyNew" class="btn btn-secondary">Copy New Captions</button>
    </div>
    <div id="status" class="status"></div>

    <hr class="divider">

    <div class="settings">
      <div class="setting-header">
        <span class="setting-title">Translation Settings</span>
        <span class="setting-hint">Click any caption to translate</span>
      </div>
      <div class="api-key-group">
        <input type="password" id="apiKey" placeholder="Gemini API Key" class="input">
        <button id="saveKey" class="btn btn-small">Save</button>
      </div>
      <div id="keyStatus" class="key-status"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
