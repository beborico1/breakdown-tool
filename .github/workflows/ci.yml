name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:nlp
      - run: npm run test:unit
        # dom (npm run test:dom) and e2e (npm run test:e2e) both need a real
        # Chromium, e2e with the unpacked extension loaded, so they stay
        # local/manual checks rather than running in CI.
