name: CI

on:
  # Not main-only: the v2 branch never had a single CI run under the previous
  # trigger, so the zip denylist assertion below had never executed against it.
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:nlp
      - run: npm run test:unit

      # Package on every run, not just releases: the packaging script is what
      # enforces the version match, the dictionary presence, and the denylist
      # that keeps scratch and confidential files out of a published zip. A
      # failure here is a release blocker, so it should surface on the PR.
      - run: npm run package

      - name: Packaged zip contains the dictionaries and nothing it should not
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          zip="japanese-in-color-v${version}.zip"
          test -f "$zip" || { echo "expected $zip"; exit 1; }
          list=$(unzip -Z1 "$zip")
          for dir in assets/jmdict assets/kuromoji-dict assets/kanjidic; do
            echo "$list" | grep -q "^$dir/" || { echo "missing $dir"; exit 1; }
          done
          if echo "$list" | grep -Ei '\.(md|txt|zip)$|\.DS_Store|(^|/)tests?/|sample\.html'; then
            echo "denylisted file in package"; exit 1
          fi
          echo "package contents OK ($(echo "$list" | wc -l) files)"

      # The Playwright suites (test:dom, test:pages, test:e2e) need a real
      # Chromium with the extension loaded, so they stay a local check.
