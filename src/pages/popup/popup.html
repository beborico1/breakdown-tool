<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会議 kaigi meeting</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Meet Captions</h1>
    <div class="buttons">
      <button id="copyAll" class="btn btn-primary">Copy All Captions</button>
      <button id="copyNew" class="btn btn-secondary">Copy New Captions</button>
    </div>
    <div id="status" class="status"></div>

    <hr class="divider">

    <div class="settings">
      <div class="setting-header">
        <span class="setting-title">Gemini API Key</span>
        <span class="setting-hint" id="modelCostHint">Uses Gemini 2.5 Flash (~$0.15/1M tokens)</span>
      </div>
      <div class="api-key-group">
        <input type="password" id="apiKey" placeholder="Gemini API Key" class="input">
        <button id="saveKey" class="btn btn-small">Save</button>
      </div>
      <div id="keyStatus" class="key-status"></div>
      <div class="model-selector">
        <label class="setting-hint" for="modelSelect">Model</label>
        <select id="modelSelect" class="input">
          <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
          <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash Lite</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
          <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
          <option value="gemini-2.0-flash-lite">Gemini 2.0 Flash Lite</option>
        </select>
      </div>
    </div>

    <hr class="divider">

    <div class="usage-section">
      <div class="usage-header">
        <span class="setting-title">Token Usage</span>
        <button class="usage-reset" id="resetUsage" title="Reset usage counter">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
        </button>
      </div>
      <div class="usage-stats">
        <div class="usage-stat">
          <span class="usage-stat-value" id="tokenCount">0</span>
          <span class="usage-stat-label">tokens used</span>
        </div>
        <div class="usage-stat">
          <span class="usage-stat-value" id="tokenCost">~$0.00</span>
          <span class="usage-stat-label">est. cost</span>
        </div>
      </div>
    </div>

    <hr class="divider">

    <div class="font-size-section">
      <div class="setting-header">
        <div class="font-size-header">
          <span class="setting-title">Card Font Size</span>
          <span class="font-size-value" id="fontSizeValue">15px</span>
        </div>
      </div>
      <input type="range" id="fontSizeSlider" class="font-size-slider" min="10" max="24" step="1" value="15">
    </div>

    <!-- Minimalistic Mode - commented out
    <hr class="divider">

    <div class="mode-toggle">
      <div class="setting-info">
        <span class="setting-title">Minimalistic Mode</span>
        <span class="setting-hint">Inline colored text with hover tooltips</span>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="minimalisticToggle">
        <span class="toggle-slider"></span>
      </label>
    </div>
    -->

    <hr class="divider">

    <div class="audio-mode-section">
      <div class="setting-info">
        <span class="setting-title">Japanese Audio Mode</span>
        <span class="setting-hint">Transcribe & break down audio from any tab</span>
      </div>
      <button id="audioModeToggle" class="btn btn-primary" style="width: 100%; margin-top: 6px;">Start Listening</button>
    </div>

    <hr class="divider">

    <div class="transcribe-section">
      <button id="liveTranscribe" class="btn btn-secondary" style="width: 100%;">Live Japanese Transcription</button>
    </div>

    <hr class="divider">

    <div class="frequency-section">
      <button id="viewAllWords" class="btn btn-secondary" style="width: 100%;">View Word Frequency Dashboard</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
