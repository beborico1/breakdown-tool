<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会議 kaigi meeting</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Meet Captions</h1>
    <div class="buttons">
      <button id="copyAll" class="btn btn-primary">Copy All Captions</button>
      <button id="copyNew" class="btn btn-secondary">Copy New Captions</button>
    </div>
    <div id="status" class="status"></div>

    <hr class="divider">

    <div class="settings">
      <div class="setting-header">
        <span class="setting-title">Translation Settings</span>
        <span class="setting-hint">Click any caption to translate</span>
      </div>
      <div class="api-key-group">
        <input type="password" id="apiKey" placeholder="Gemini API Key" class="input">
        <button id="saveKey" class="btn btn-small">Save</button>
      </div>
      <div id="keyStatus" class="key-status"></div>
    </div>

    <hr class="divider">

    <div class="mode-toggle">
      <div class="setting-info">
        <span class="setting-title">Minimalistic Mode</span>
        <span class="setting-hint">Inline colored text with hover tooltips</span>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="minimalisticToggle">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <hr class="divider">

    <div class="frequency-section">
      <div class="setting-header">
        <span class="setting-title">Word Frequency</span>
      </div>
      <div class="frequency-stats">
        <span id="uniqueWords">0 unique</span>
        <span class="stat-separator">•</span>
        <span id="totalWords">0 total</span>
      </div>
      <div id="topWords" class="top-words">
        <span class="top-words-empty">No words tracked yet</span>
      </div>
      <div class="frequency-buttons">
        <button id="viewAllWords" class="btn btn-secondary btn-freq">View All Words</button>
        <button id="clearData" class="btn btn-danger btn-freq">Clear Data</button>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
